# polyarchy サービス（SyslogIdentifier=polyarchy-*）の journald 転送をサービス別ファイルへ（docs/運用設計.md）。
# CW agent が /var/log/polyarchy/polyarchy-{mcp,stats,companies}.log を CloudWatch Logs（保持 30 日）へ転送する。
# ローテーションは /etc/logrotate.d/polyarchy（bootstrap ⑪ が設置）。
$template PolyarchyFile,"/var/log/polyarchy/%programname%.log"
if $programname startswith 'polyarchy-' then -?PolyarchyFile
& stop
